version: '3.8'

services:
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    container_name: todo-app
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      - mongo
    environment:
      - mongoDbUrl=mongodb://mongo:27017/todo-db
      - PORT=4000

volumes:
  mongo-data:
